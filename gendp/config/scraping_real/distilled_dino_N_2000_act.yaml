_target_: gendp.workspace.train_act_workspace.TrainACTWorkspace
is_real: true
data_root: /home/showlab/gendp
output_dir: ${data_root}/data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
# output_dir: /users/kevinma/gendp/data/outputs/2025.03.25/13.36.38_train_diffusion_unet_hybrid_screw_driving
checkpoint:
  save_last_ckpt: true
  save_last_snapshot: false
  topk:
    format_str: epoch={epoch:04d}-test_mean_score={test_mean_score:.3f}.ckpt
    k: 5
    mode: max
    monitor_key: test_mean_score
dataloader:
  batch_size: 128
  num_workers: 8
  persistent_workers: false
  pin_memory: true
  shuffle: true
dataset_obs_steps: 2
ema:
  _target_: gendp.model.diffusion.ema_model.EMAModel
  inv_gamma: 1.0
  max_value: 0.9999
  min_value: 0.0
  power: 0.75
  update_after_step: 0
exp_name: default
horizon: 16
keypoint_visible_rate: 1.0
logging:
  group: null
  id: null
  mode: online # online, offline
  name: ${now:%Y.%m.%d}_${task_name}_${dataset_name}
  project: gild_${task_name}
  resume: false
  tags:
  - train_act
  - ${task_name}
  - franka
  - realsense
  - default
n_action_steps: 8
n_latency_steps: 0
n_obs_steps: 2
name: train_act
obs_as_global_cond: true
optimizer:
  _target_: torch.optim.AdamW
  betas:
  - 0.95
  - 0.999
  eps: 1.0e-08
  lr: 0.0001
  weight_decay: 1.0e-06
past_action_visible: false
shape_meta:
  trim_tail: 0
  action:
    # key: joint_action
    # shape:
    # - 8
    shape:
    - 10
  obs:
    ee_pose:
      type: low_dim
      shape:
      - 7
    joint_pos:
      type: low_dim
      shape:
      - 9
    joint_vel:
      type: low_dim
      shape:
      - 9
    d3fields:
      shape:
      - 5 # C
      - 2000 # N
      type: spatial
      info:
        reference_frame: robot
        distill_dino: true
        distill_obj: scraper
        view_keys:
        - camera_front
        - camera_left
        - camera_right
        N_gripper: 100
        boundaries:
          x_lower: 0.3
          x_upper: 0.7
          y_lower: -0.2
          y_upper: 0.2
          z_lower: -0.03
          z_upper: 0.5
        resize_ratio: 0.5

policy:
  _target_: gendp.policy.act_policy.ACTPolicy
  enc_layers: 4
  dec_layers: 7
  nheads: 8
  lr_backbone: 0.0001
  lr: 0.0001
  backbone: pn2
  kl_weight: 10
  hidden_dim: 512
  dim_feedforward: 2048
  chunk_size: 16
  shape_meta: ${shape_meta}
  n_action_steps: 8
task:
  abs_action: true
  dataset:
    _target_: gendp.dataset.real_dataset.RealDataset
    dataset_dir: ${data_root}/data/${dataset_name}
    vis_input: false
    horizon: 16
    pad_after: 7
    pad_before: 1
    rotation_rep: rotation_6d
    seed: 42
    n_obs_steps: 2
    robot_name: panda
    # exclude_colors: [yellow]
    shape_meta: ${shape_meta}
    use_cache: true
    val_ratio: 0.1
  dataset_dir: ${data_root}/data/${dataset_name}
  name: ${task_name}
  shape_meta: ${shape_meta}
  task_name: ${task_name}
task_name: scraper_real
dataset_name: scraper_combined
training:
  checkpoint_every: 1000
  debug: false
  device: cuda
  device_id: 1
  gradient_accumulate_every: 1
  lr_scheduler: cosine
  lr_warmup_steps: 500
  max_train_steps: null
  max_val_steps: null
  num_epochs: 10001
  resume: False
  rollout_every: 1000
  sample_every: 5
  seed: 42
  tqdm_interval_sec: 1.0
  use_ema: true
  val_every: 10
val_dataloader:
  batch_size: 64
  num_workers: 8
  persistent_workers: false
  pin_memory: true
  shuffle: false
