_target_: gendp.workspace.train_diffusion_unet_hybrid_workspace.TrainDiffusionUnetHybridWorkspace
is_real: true
data_root: /home/kevin/gendp
output_dir: ${data_root}/data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
checkpoint:
  save_last_ckpt: true
  save_last_snapshot: false
  topk:
    format_str: epoch={epoch:04d}-test_mean_score={test_mean_score:.3f}.ckpt
    k: 5
    mode: max
    monitor_key: test_mean_score
dataloader:
  batch_size: 64
  num_workers: 8
  persistent_workers: false
  pin_memory: true
  shuffle: true
dataset_obs_steps: 2
ema:
  _target_: gendp.model.diffusion.ema_model.EMAModel
  inv_gamma: 1.0
  max_value: 0.9999
  min_value: 0.0
  power: 0.75
  update_after_step: 0
exp_name: default
horizon: 16
keypoint_visible_rate: 1.0
logging:
  group: null
  id: null
  mode: online # online
  name: ${now:%Y.%m.%d}_${task_name}_${dataset_name}
  project: gild_${task_name}
  resume: false
  tags:
  - train_diffusion_unet_hybrid
  - ${task_name}
  - franka
  - realsense
  - default
n_action_steps: 8
n_latency_steps: 0
n_obs_steps: 2
name: train_diffusion_unet_hybrid
obs_as_global_cond: true
optimizer:
  _target_: torch.optim.AdamW
  betas:
  - 0.95
  - 0.999
  eps: 1.0e-08
  lr: 0.0001
  weight_decay: 1.0e-06
past_action_visible: false

shape_meta:
  trim_tail: 0
  action:
    shape:
    - 7
    delta: true
  obs:
    d3fields:
      shape:
      - 5 # C
      - 2048 # N
      type: spatial
      info:
        reference_frame: robot
        distill_dino: true
        distill_obj: scraper
        view_keys:
        - camera_front
        - camera_left
        - camera_right
        N_gripper: 10
        boundaries:
          x_lower: 0.3
          x_upper: 0.7
          y_lower: -0.2
          y_upper: 0.2
          z_lower: -0.03
          z_upper: 0.5
        resize_ratio: 0.5
    ee_pose:
      type: low_dim
      shape:
      - 9
    joint_pos:
      type: low_dim
      shape:
      - 9
    joint_vel:
      type: low_dim
      shape:
      - 9
    tactile_left_force_field:
      shape:
      - 9  # force field current (3) + reference (3) + coordinates (3) combined
      - 63 # 7×9 = 63 markers
      type: tactile
    tactile_right_force_field:
      shape:
      - 9  # force field current (3) + reference (3) + coordinates (3) combined
      - 63 # 7×9 = 63 markers
      type: tactile
  
  # Tactile settings stored separately since they're used by base keys
  tactile_settings:
    tactile_left:
      N: 7
      M: 9
      fps: 10
      x0: 34.5
      y0: 37.5
      dx: 28.7
      dy: 29.6
    tactile_right:
      N: 7
      M: 9
      fps: 10
      x0: 40.6
      y0: 46
      dx: 28.6
      dy: 29.1

policy:
  _target_: gendp.policy.diffusion_unet_hybrid_image_policy.DiffusionUnetHybridImagePolicy
  cond_predict_scale: true
  diffusion_step_embed_dim: 128
  down_dims:
  - 512
  - 1024
  - 2048
  eval_fixed_crop: true
  horizon: 16
  kernel_size: 5
  n_action_steps: 8
  n_groups: 8
  n_obs_steps: 2
  noise_scheduler:
    _target_: diffusers.schedulers.scheduling_ddpm.DDPMScheduler
    beta_end: 0.02
    beta_schedule: squaredcos_cap_v2
    beta_start: 0.0001
    clip_sample: true
    num_train_timesteps: 100
    prediction_type: epsilon
    variance_type: fixed_small
  num_inference_steps: 100
  obs_as_global_cond: true
  obs_encoder_group_norm: true
  feat_proc: distill # none, linear, mlp
  compositional: false
  shape_meta: ${shape_meta}

task:
  abs_action: true
  dataset:
    _target_: gendp.dataset.real_dataset.RealDataset
    dataset_dir: ${data_root}/data/${dataset_name}
    vis_input: false
    horizon: 16
    pad_after: 7
    pad_before: 1
    rotation_rep: rotation_6d
    seed: 42
    n_obs_steps: 2
    robot_name: panda
    # exclude_colors: [yellow]
    shape_meta: ${shape_meta}
    use_cache: true
    val_ratio: 0.1
  dataset_dir: ${data_root}/data/${dataset_name}
  name: ${task_name}
  shape_meta: ${shape_meta}
  task_name: ${task_name}
task_name: scraper_real_tactile_ff
dataset_name: scraper_combined
training:
  checkpoint_every: 1000
  debug: false
  device: cuda
  device_id: 0
  gradient_accumulate_every: 1
  lr_scheduler: cosine
  lr_warmup_steps: 500
  max_train_steps: null
  max_val_steps: null
  num_epochs: 10001
  resume: false
  rollout_every: 1000
  sample_every: 5
  seed: 42
  tqdm_interval_sec: 1.0
  use_ema: true
  val_every: 10
val_dataloader:
  batch_size: 64
  num_workers: 8
  persistent_workers: false
  pin_memory: true
  shuffle: false
